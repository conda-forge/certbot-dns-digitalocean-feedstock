context:
  version: "5.8.0"

package:
  name: certbot-dns-digitalocean
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/c/certbot-dns-digitalocean/certbot_dns_digitalocean-${{ version }}.tar.gz
  sha256: 5c08b3a2c9ab097fa7c6122b972920082ae19077dbb374a3f8a121746ee35ee3

build:
  noarch: python
  script: python -m pip install . -vv
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - acme >=${{ version }}
    - certbot >=${{ version }}
    - python-digitalocean >=1.15.0

tests:
  - python:
      imports:
        - certbot_dns_digitalocean
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://certbot.eff.org
  summary: DigitalOcean DNS Authenticator plugin for Certbot
  license: Apache-2.0
  license_file: LICENSE.txt
  documentation: https://certbot.eff.org
  repository: https://github.com/certbot/certbot

extra:
  recipe-maintainers:
    - pavelzw
